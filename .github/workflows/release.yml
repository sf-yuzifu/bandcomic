name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v2.3)'
        required: false
        type: string
      with_builtin_sources:
        description: 'Include sources from BANDCOMIC_PRIVATE_CONFIG secret'
        default: false
        type: boolean
      with_online_update:
        description: 'Include update URL from BANDCOMIC_PRIVATE_CONFIG secret'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup signing certificates
        env:
          SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
          SIGN_PRIVATE_KEY: ${{ secrets.SIGN_PRIVATE_KEY }}
        run: |
          mkdir -p sign
          if [ -n "$SIGN_CERTIFICATE" ] && [ -n "$SIGN_PRIVATE_KEY" ]; then
            printf "%s\n" "$SIGN_CERTIFICATE" > sign/certificate.pem
            printf "%s\n" "$SIGN_PRIVATE_KEY" > sign/private.pem
            chmod 600 sign/private.pem
            echo "Signing certificates configured successfully from secrets."
          else
            echo "::error::SIGN_CERTIFICATE or SIGN_PRIVATE_KEY secret is not set!"
            exit 1
          fi

      - name: Setup optional private configuration
        if: ${{ inputs.with_builtin_sources || inputs.with_online_update }}
        env:
          BANDCOMIC_PRIVATE_CONFIG: ${{ secrets.BANDCOMIC_PRIVATE_CONFIG }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = process.env.BANDCOMIC_PRIVATE_CONFIG;
            if (!config) {
              console.error("BANDCOMIC_PRIVATE_CONFIG secret is required for enabled private features");
              process.exit(1);
            }
            try { JSON.parse(config); } catch {
              console.error("BANDCOMIC_PRIVATE_CONFIG must contain valid JSON");
              process.exit(1);
            }
            fs.writeFileSync("private.config.json", config);
          '

      - name: Build release package
        env:
          WITH_BUILTIN_SOURCES: ${{ inputs.with_builtin_sources && 'true' || 'false' }}
          WITH_ONLINE_UPDATE: ${{ inputs.with_online_update && 'true' || 'false' }}
        run: |
          args=()
          if [ "$WITH_BUILTIN_SOURCES" = "true" ]; then args+=(--with-builtin-sources); fi
          if [ "$WITH_ONLINE_UPDATE" = "true" ]; then args+=(--with-online-update); fi
          yarn run release "${args[@]}"

      - name: List build artifacts
        run: ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/*.rpk
          generate_release_notes: true
          draft: false
          prerelease: false
